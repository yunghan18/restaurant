    const selected={}; let current=null; let lastPool=[]; let submitted=false;

    const requiredFilters=filters.filter(f=>!f.optional);
    function ready(){return requiredFilters.every(f=>selected[f.id])}
    const pendingSubmissionIds=new Set();
    const savedSubmissionIds=new Set();
    let nextSubmissionId=0;
    let activeSubmissionId=0;
    async function saveQuestionnaire(matchScore,submissionId){
      if(savedSubmissionIds.has(submissionId))return true;
      if(pendingSubmissionIds.has(submissionId))return false;
      const status=document.querySelector('#status');
      const submitQuestionnaireResponse=window.submitQuestionnaireResponse;
      if(!submitQuestionnaireResponse){status.textContent='Supabase 尚未就緒，請再按一次儲存';return false}
      const answer={hunger:selected.hunger,people:selected.people,mood:selected.mood,time_slot:selected.time,budget:selected.budget,cuisine:selected.cuisine||null,restaurant_name:current.name,recommended_item:current.item,restaurant_type:current.type,restaurant_area:current.area,restaurant_cuisine:current.cuisine,price_info:current.price,restaurant_source:current.source,source_url:current.url,match_score:matchScore};
      pendingSubmissionIds.add(submissionId);
      status.textContent='正在儲存問卷…';
      try{
        await submitQuestionnaireResponse(answer);
        savedSubmissionIds.add(submissionId);
        if(activeSubmissionId===submissionId)status.textContent='問卷已儲存';
        return true;
      }catch(error){
        console.error('Questionnaire save failed:',error);
        status.textContent='問卷儲存失敗，請再按一次重試';
        return false;
      }finally{
        pendingSubmissionIds.delete(submissionId);
      }
    }
    function getPool(){const cuisine=selected.cuisine;const eligible=cuisine&&cuisine!=='all'?restaurants.filter(r=>r.cuisine===cuisine):restaurants;const active=requiredFilters.filter(f=>selected[f.id]);return eligible.map(r=>({restaurant:r,score:active.reduce((n,f)=>{const value=r[f.id];return n+((Array.isArray(value)?value.includes(selected[f.id]):value===selected[f.id])?1:0)},0),total:active.length})).sort((a,b)=>b.score-a.score)}

.google.com/maps/search/?api=1&query=${encodeURIComponent(current.name+' '+current.area+' 高雄')}" target="_blank" rel="noopener">地圖導航 ↗</a></p>`;document.querySelector('#price').innerHTML=`你的條件已完成<span>／高雄餐廳推薦</span>`;button.disabled=false;button.textContent='再推薦一家 ↗';status.textContent='五項條件已完成'}
    groups.addEventListener('click',e=>{const b=e.target.closest('.option');if(!b)return;const {filter,value}=b.dataset;if(selected[filter]===value)delete selected[filter];else selected[filter]=value;submitted=false;groups.querySelectorAll(`[data-filter="${filter}"]`).forEach(x=>{const on=x.dataset.value===selected[filter];x.classList.toggle('selected',on);x.setAttribute('aria-pressed',on)});draw()});
